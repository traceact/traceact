[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceact"
version = "0.13.1"
description = "X-ray vision for your code. Lightweight action-level tracing for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mohammed Shehu" }
]
keywords = ["tracing", "observability", "debugging", "devtools", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Logging",
]

# TraceAct has no runtime dependencies.
# It relies entirely on the Python standard library so it can be dropped into
# any project without pulling in extra packages.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    # Test-order randomisation. Activates automatically once installed — no
    # flag needed. Kept on deliberately: an order-dependent failure means
    # shared/global state is leaking between tests, which is a real bug.
    # Never pin --randomly-seed in CI to "stabilise" a run; that hides exactly
    # the failure mode this plugin exists to catch.
    "pytest-randomly>=3.15",
    # Real framework objects for propagation tests (extract_trace_id,
    # TraceActMiddleware, TraceActASGIMiddleware). These are test-only —
    # traceact itself has zero runtime dependencies. Testing against a
    # hand-built dict instead of an actual Flask/Django/Starlette request
    # object was exactly the gap that let a header-parsing bug through
    # 43 green tests; these are here so that never happens again.
    "flask>=3.0",
    "starlette>=0.36",
    "django>=4.2",
    "requests>=2.31",
    # Starlette's TestClient switched to httpx2 and deprecates the httpx
    # backend; without this the ASGI middleware tests still pass but emit a
    # StarletteDeprecationWarning, and they break outright once Starlette drops
    # the httpx path.
    "httpx2>=2.9",
    # Real framework objects for the LangChain adapter tests
    # (traceact.integrations.langchain). Same rationale as above: the
    # adapter is exercised through langchain-core's own callback dispatch
    # (fake models, real tools, real runnables), not hand-built dicts.
    "langchain-core>=0.2",
    # Real Celery dispatch for the queue-tracing tests (inject_context /
    # traceact_context). Uses Celery's in-memory broker and its testing
    # worker — no Redis or external service — but the job still crosses a
    # genuine boundary: kombu JSON-serialises the message, and the worker
    # thread has its own empty ContextVar context, so trace linkage in the
    # test can only come from the payload.
    "celery>=5.3",
]

[project.urls]
Homepage = "https://github.com/traceact/traceact"
Repository = "https://github.com/traceact/traceact"
Documentation = "https://github.com/traceact/traceact/blob/main/USAGE.md"
Changelog = "https://github.com/traceact/traceact/blob/main/CHANGELOG.md"
Issues = "https://github.com/traceact/traceact/issues"
Author = "https://mohammedshehu.com"

# The `traceact` command line. Both `traceact view` and `traceact show` are
# handled inside cli:main.
[project.scripts]
traceact = "traceact.viewer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["traceact*"]

# Ship the viewer's static frontend (HTML/CSS/JS) inside the wheel, and a
# copy of USAGE.md so the docs travel with `pip install traceact` itself —
# not just with the sdist or the GitHub repo. USAGE.md's source of truth
# stays at the repo root (where README/LICENSE/CHANGELOG live); the build
# copies it to traceact/USAGE.md right before packaging (see publish.yml and
# scripts/copy_usage_doc.py). The copy is gitignored — it's generated, never
# hand-edited, and never committed.
[tool.setuptools.package-data]
"traceact.viewer" = ["static/*"]
"traceact" = ["USAGE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
