[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceact"
version = "0.1.0"
description = "X-ray vision for your code. Lightweight action-level tracing for Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Mo Shehu" }
]
keywords = ["tracing", "observability", "debugging", "devtools", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Logging",
]

# TraceAct has no runtime dependencies.
# It relies entirely on the Python standard library so it can be dropped into
# any project without pulling in extra packages.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://mohammedshehu.com"
Repository = "https://github.com/traceact/traceact"

[tool.setuptools.packages.find]
where = ["."]
include = ["traceact*"]
