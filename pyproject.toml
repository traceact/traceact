[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceact"
version = "0.1.0"
description = "Lightweight action-level tracing for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# TraceAct has no runtime dependencies.
# It relies entirely on the Python standard library so it can be dropped into
# any project without pulling in extra packages.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["traceact*"]
