name: Publish to PyPI

# Publishes TraceAct to PyPI whenever a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens or stored secrets.
# The identity is proven by GitHub's OIDC token, which PyPI verifies against
# the trusted publisher you configure on the PyPI project settings page.

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest

    # The environment name must match the one you set on PyPI's trusted
    # publisher configuration.
    environment: pypi

    permissions:
      # Required for Trusted Publishing (OIDC). Without this the publish fails.
      id-token: write
      # Required for actions/checkout. Declaring any permissions block
      # defaults all others to "none", so contents: read must be listed
      # explicitly or checkout fails.
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bundle USAGE.md into the package
        # The wheel only ever contains files inside traceact/, so the
        # root-level USAGE.md (the single source of truth — same place as
        # README/LICENSE/CHANGELOG) is copied in here, right before the
        # build reads [tool.setuptools.package-data]. This copy is
        # gitignored; it must never be committed or hand-edited.
        run: cp USAGE.md traceact/USAGE.md

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
