name: CI

# Runs the test suite and type-checker on every push and pull request. Never
# ran before v0.14.2 — traceact's only other workflows were CLA signing and
# the PyPI publish step, so nothing verified a change before it shipped.
# Two separate failure modes prompted this:
#   1. Nothing caught a regression before `gh release create` built and
#      published straight from main.
#   2. traceact ships a py.typed marker (PEP 561), so a downstream
#      strict-mypy consumer inherits whatever the annotations claim —
#      without this job, an annotation could drift from what the code
#      actually does and nothing would notice. mypy caught 13 real errors
#      the first time it ran here (see the type-check job below).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python and the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        # pytest-randomly is a dev dependency and activates automatically —
        # no flag needed, and the default seed varies run to run by design
        # (see the note in pyproject.toml's dev extras).
        run: python -m pytest -q

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy traceact/
